<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chronicle: Unlimited Bible Trivia</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0e14;
            --bg-card: #121824;
            --gold: #dfb76c;
            --gold-bright: #ffd993;
            --text-white: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(223, 183, 108, 0.2);
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #162235 0%, #0a0e14 100%);
        }

        .wrapper {
            background-color: var(--bg-card);
            max-width: 700px;
            width: 100%;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            position: relative;
        }

        .wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .screen {
            padding: 40px;
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            text-align: center;
            font-size: 30px;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 35px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .cat-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: var(--gold);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* Difficulty Grid */
        .diff-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .diff-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            color: var(--text-white);
            padding: 15px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .diff-btn:hover, .diff-btn.selected {
            border-color: var(--gold);
            background: rgba(223, 183, 108, 0.1);
            color: var(--gold-bright);
            box-shadow: 0 0 15px rgba(223, 183, 108, 0.1);
        }

        /* Category List */
        .cat-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .cat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-card:hover {
            border-color: var(--gold);
            transform: translateX(5px);
            background: rgba(223, 183, 108, 0.03);
        }

        .cat-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cat-name {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            color: var(--text-white);
            letter-spacing: 1px;
        }

        .cat-desc {
            font-size: 12px;
            color: var(--text-dim);
        }

        .unli-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(223, 183, 108, 0.1);
            color: var(--gold-bright);
            border: 1px solid var(--gold);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Quiz Header Meta */
        .quiz-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .meta-tag {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--gold);
        }

        .score-tracker {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            color: var(--gold-bright);
            background: rgba(223, 183, 108, 0.05);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(223, 183, 108, 0.2);
        }

        .question-text {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .options-stack {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-white);
            padding: 18px 24px;
            border-radius: 10px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--gold);
            background: rgba(223, 183, 108, 0.05);
        }

        .option-btn.correct {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--success) !important;
            color: #a7f3d0;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--danger) !important;
            color: #fca5a5;
        }

        .scripture-guide {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-dim);
            font-style: italic;
            display: block;
        }

        .quiz-footer {
            margin-top: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quit-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            transition: all 0.2s;
        }

        .quit-btn:hover {
            color: white;
            border-color: white;
        }

        .nav-btn {
            background-color: var(--gold);
            color: var(--bg-main);
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            visibility: hidden;
        }

        .nav-btn:hover {
            background-color: var(--gold-bright);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <!-- SCREEN 1: DASHBOARD -->
        <div id="screen-dashboard" class="screen active">
            <h1>The Grand Bible Trivia</h1>
            <div class="subtitle">Mula Genesis hanggang Pahayag • UNLI MODE</div>
            
            <div class="cat-title">1. Pumili ng Antas (Difficulty):</div>
            <div class="diff-grid">
                <button class="diff-btn selected" id="btn-easy" onclick="setDifficulty('easy')">✨ Easy</button>
                <button class="diff-btn" id="btn-medium" onclick="setDifficulty('medium')">📜 Medium</button>
                <button class="diff-btn" id="btn-hard" onclick="setDifficulty('hard')">🏛️ Difficult</button>
            </div>

            <div class="cat-title">2. Pumili ng Kategorya para sa Walang-Humpay na Tanong:</div>
            <div class="cat-grid">
                <div class="cat-card" onclick="startUnliTrivia('names')">
                    <div class="cat-info">
                        <span class="cat-name">👤 Names (Mga Pangalan)</span>
                        <span class="cat-desc">Mga karakter, propeta, hari, at mga tapat na lingkod.</span>
                    </div>
                    <span class="unli-badge">UNLI</span>
                </div>
                <div class="cat-card" onclick="startUnliTrivia('places')">
                    <div class="cat-info">
                        <span class="cat-name">📍 Places (Mga Lugar)</span>
