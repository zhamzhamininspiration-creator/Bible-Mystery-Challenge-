<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Georgia, serif;
    background: linear-gradient(135deg, #111827, #312e81);
    color: white;
    min-height: 100vh;
}

.container {
    width: 92%;
    max-width: 800px;
    margin: auto;
    padding: 25px 10px;
}

header {
    text-align: center;
    padding: 20px 10px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

header p {
    color: #ddd;
    line-height: 1.6;
}

.card {
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: 20px;
    padding: 25px;
    margin-top: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.categories {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.category {
    border: none;
    border-radius: 15px;
    padding: 20px 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: white;
    color: #222;
}

.category:hover {
    transform: scale(1.03);
}

.info {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    color: #ddd;
    font-size: 14px;
}

.question {
    font-size: 22px;
    font-weight: bold;
    line-height: 1.5;
    margin: 25px 0;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    color: white;
    border-radius: 12px;
    padding: 15px;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
}

.answer:hover {
    background: rgba(255,255,255,0.18);
}

.answer:disabled {
    cursor: default;
    opacity: 1;
}

.next {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: white;
    color: #111827;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
}

.next:hover {
    transform: scale(1.02);
}

.reference {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.10);
    text-align: center;
    font-size: 14px;
}

.score {
    font-size: 45px;
    font-weight: bold;
    text-align: center;
    margin: 20px;
}

.result {
    text-align: center;
}

.hidden {
    display: none;
}

footer {
    text-align: center;
    margin: 25px 0;
    font-size: 13px;
    color: #ddd;
}

@media (max-width: 600px) {

    header h1 {
        font-size: 27px;
    }

    .categories {

    }

/* =================================
   QUIZ SYSTEM
================================= */

let currentCategory = "";
let currentQuestion = 0;
let score = 0;
let shuffledQuestions = [];
let answered = false;


/* SHUFFLE */

function shuffle(array) {

    let result = [...array];

    for (let i = result.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        [result[i], result[j]] =
        [result[j], result[i]];
    }

    return result;
}


/* START QUIZ */

function startQuiz(category) {

    currentCategory = category;

    currentQuestion = 0;

    score = 0;

    answered = false;

    shuffledQuestions =
        shuffle(questions[category]);

    document.getElementById("home")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.add("hidden");

    document.getElementById("quiz")
        .classList.remove("hidden");

    document.getElementById("categoryName")
        .textContent =
        "Category: " + category;

    showQuestion();
}


/* SHOW QUESTION */

function showQuestion() {

    answered = false;

    const q =
        shuffledQuestions[currentQuestion];

    document.getElementById("questionNumber")
        .textContent =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        shuffledQuestions.length;

    document.getElementById("scoreText")
        .textContent =
        "Score: " + score;

    document.getElementById("question")
        .textContent = q.q;

    const answersContainer =
        document.getElementById("answers");

    answersContainer.innerHTML = "";


    /* RANDOMIZE ANSWERS */

    const choices =
        q.a.map((answer, index) => ({

            text: answer,

            originalIndex: index

        }));


    const shuffledChoices =
        shuffle(choices);


    shuffledChoices.forEach(choice => {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.textContent =
            choice.text;


        button.onclick = function() {

            checkAnswer(
                choice.originalIndex,
                q.c,
                button,
                q.ref
            );

        };


        answersContainer
            .appendChild(button);

    });

}


/* CHECK ANSWER */

function checkAnswer(
    selected,
    correct,
    button,
    reference
) {

    if (answered) {
        return;
    }

    answered = true;


    const answerButtons =
        document.querySelectorAll(".answer");


    answerButtons.forEach(btn => {

        btn.disabled = true;

    });


    if (selected === correct) {

        score++;

        button.textContent =
            "✅ " + button.textContent;

    } else {

        button.textContent =
            "❌ " + button.textContent;


        answerButtons.forEach(btn => {

            const cleanText =
                btn.textContent
                .replace("❌ ", "")
                .replace("✅ ", "");

            if (
                cleanText ===
                shuffledQuestions[
                    currentQuestion
                ].a[correct]
            ) {

                btn.textContent =
                    "✅ " + cleanText;

            }

        });

    }


    document.getElementById("scoreText")
        .textContent =
        "Score: " + score;


    /* BIBLE REFERENCE */

    const referenceBox =
        document.createElement("div");

    referenceBox.className =
        "reference";

    referenceBox.textContent =
        "📖 Bible Reference: " +
        reference;

    document.getElementById("answers")
        .appendChild(referenceBox);

}


/* NEXT QUESTION */

function nextQuestion() {

    if (!answered) {

        alert(
            "Piliin muna ang iyong sagot bago magpatuloy."
        );

        return;
    }


    currentQuestion++;


    if (
        currentQuestion >=
        shuffledQuestions.length
    ) {

        showResult();

        return;

    }


    showQuestion();

}


/* SHOW RESULT */

function showResult() {

    document.getElementById("quiz")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.remove("hidden");


    const total =
        shuffledQuestions.length;


    const percentage =
        Math.round(
            (score / total) * 100
        );


    document.getElementById("finalScore")
        .textContent =
        score + " / " + total;


    let message;


    if (percentage >= 90) {

        message =
        "🏆 Bible Master! Napakahusay ng iyong Bible knowledge!";

    }

    else if (percentage >= 75) {

        message =
        "🔥 Excellent! Malalim ang iyong kaalaman sa Bible!";

    }

    else if (percentage >= 50) {

        message =
        "📖 Good job! Ipagpatuloy ang pagbabasa ng Bible!";

    }

    else {

        message =
        "🙏 Keep studying God's Word. Huwag sumuko!";

    }


    document.getElementById("finalMessage")
        .textContent =
        message +
        " Your score: " +
        percentage +
        "%";

}


/* PLAY AGAIN */

function goHome() {

    document.getElementById("result")
        .classList.add("hidden");

    document.getElementById("quiz")
        .classList.add("hidden");

    document.getElementById("home")
        .classList.remove("hidden");

}
