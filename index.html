<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible Mystery Challenge</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #14002e, #3b176d, #17002f);
  color: white;
  min-height: 100vh;
}

.container {
  width: 94%;
  max-width: 650px;
  margin: auto;
  padding: 25px 0;
}

header {
  text-align: center;
  padding: 20px 10px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  color: #ddd;
  line-height: 1.5;
}

.card {
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px;
  padding: 25px;
  margin-top: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.hidden {
  display: none;
}

.category-grid,
.difficulty-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 20px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  background: #7042c4;
}

button:hover {
  opacity: 0.9;
}

.category-btn {
  min-height: 60px;
}

.easy {
  background: #258a4a;
}

.medium {
  background: #b77a16;
}

.hard {
  background: #a52b38;
}

.quiz-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 14px;
  color: #ddd;
}

#question {
  font-size: 22px;
  line-height: 1.4;
  margin: 25px 0;
}

.answers {
  display: grid;
  gap: 12px;
}

.answer-btn {
  background: #352052;
  border: 2px solid transparent;
  text-align: left;
}

.answer-btn.correct {
  background: #187a3b;
  border-color: #67e69a;
}

.answer-btn.wrong {
  background: #8b2430;
  border-color: #ff8993;
}

#reference {
  margin-top: 18px;
  color: #f4d77b;
  font-weight: bold;
}

.next-btn {
  width: 100%;
  margin-top: 20px;
  background: #7650d4;
}

.home-btn {
  width: 100%;
  margin-top: 12px;
  background: #555;
}

.result-score {
  font-size: 40px;
  font-weight: bold;
  text-align: center;
  margin: 20px 0;
  color: #f4d77b;
}

.center {
  text-align: center;
}

@media (max-width: 500px) {
  header h1 {
    font-size: 25px;
  }

  .card {
    padding: 20px;
  }

  #question {
    font-size: 19px;
  }

  .category-grid,
  .difficulty-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>📖 Bible Mystery Challenge</h1>
  <p>
    Test your Bible knowledge through challenging games,
    quizzes, clues, and mysteries.
  </p>
  <p><b>Name • Place • Thing • Book • Event</b></p>
</header>

<!-- HOME -->
<div id="homeCard" class="card">
  <h2 class="center">🎯 Choose a Category</h2>

  <div class="category-grid">
    <button class="category-btn" onclick="chooseDifficulty('Name')">
      👤 NAME
    </button>

    <button class="category-btn" onclick="chooseDifficulty('Place')">
      📍 PLACE
    </button>

    <button class="category-btn" onclick="chooseDifficulty('Thing')">
      🏺 THING
    </button>

    <button class="category-btn" onclick="chooseDifficulty('Book')">
      📚 BOOK
    </button>

    <button class="category-btn" onclick="chooseDifficulty('Event')">
      ⚡ EVENT
    </button>
  </div>
</div>

<!-- DIFFICULTY -->
<div id="difficultyCard" class="card hidden">

  <h2 class="center">🔥 Choose Difficulty</h2>

  <p class="center">
    Category: <b id="selectedCategory"></b>
  </p>

  <div class="difficulty-grid">

    <button class="easy" onclick="startQuiz('Easy')">
      🟢 EASY
    </button>

    <button class="medium" onclick="startQuiz('Medium')">
      🟡 MEDIUM
    </button>

    <button class="hard" onclick="startQuiz('Hard')">
      🔴 HARD
    </button>

  </div>

  <button class="home-btn" onclick="goHome()">
    🏠 Back to Categories
  </button>

</div>

<!-- QUIZ -->
<div id="quizCard" class="card hidden">

  <div class="quiz-top">
    <span id="categoryDisplay"></span>
    <span id="difficultyDisplay"></span>
  </div>

  <div class="quiz-top">
    <span id="questionNumber"></span>
    <span id="scoreDisplay">Score: 0</span>
  </div>

  <h2 id="question"></h2>

  <div id="answers" class="answers"></div>

  <div id="reference"></div>

  <button id="nextButton" class="next
